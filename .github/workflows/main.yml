# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  LinuxBuild:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: |
          sudo apt-get install libvlc-dev
          sudo apt-get install libvlccore-dev
          haxelib setup ~/haxelib
          chmod +x ./compile/workflow/unix.sh
          sh ./compile/workflow/unix.sh
          haxelib list
      - name: Compile
        run: haxelib run lime build Project.xml linux"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Linux
          path: 'export/release/linux/bin'
  WindowsBuild:
    runs-on: windows-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      # Runs a set of commands using the runners shell
      
      # also, shoutout to moxie for a old PR about this workflow, W to moxie
      # reason why videobot denied it because he thought it wouldn't work with the MT tool
      # which i say is BULLSHIT!!!
      # cause i'm 110% sure it'll work with 4.3.x haxe
      # so videobot, if you read this
      # uhh, can't go back dumbass :3
      # -dave
      
      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          .\"compile/workflow/windows.bat"
          haxelib list
        shell: cmd
      - name: Compile Windows
        run: haxelib run lime build windows
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universe-Windows
          path: export/release/windows/bin
  MacOSBuild:
    runs-on: macos-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4
      # Runs a set of commands using the runners shell
      - name: Install Haxelib
        run: 
          haxelib setup ~/haxelib
          chmod +x ./compile/workflow/unix.sh
          sh ./compile/workflow/unix.sh
          haxelib list
      - name: Compile
        run: haxelib run lime build mac"
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universe-MacOS
          path: export/release/macos/bin
